[project]
name = "singleflight-auth"
version = "0.1.3"
description = "Single-flight token refresh for httpx and requests. Prevents auth cache stampedes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "alibeg-begow", email = "alibegbegow@gmail.com" },
]
keywords = ["httpx", "requests", "auth", "jwt", "token-refresh", "concurrency", "single-flight", "401", "race-condition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
httpx = ["httpx>=0.24"]
requests = ["requests>=2.28"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpserver>=1.0",
    "pytest-repeat>=0.9",
    "mypy>=1.10",
    "ruff>=0.6",
    "httpx>=0.24",
    "requests>=2.28",
    "types-requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/alibeg-begow/singleflight_auth"
Repository = "https://github.com/alibeg-begow/singleflight_auth"
Issues = "https://github.com/alibeg-begow/singleflight_auth/issues"
Changelog = "https://github.com/alibeg-begow/singleflight_auth/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/singleflight_auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
