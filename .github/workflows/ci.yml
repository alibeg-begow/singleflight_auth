name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy --strict)
        run: uv run mypy src tests --strict

      - name: Run tests
        run: >
          uv run pytest -v --tb=short
          --cov=singleflight_auth --cov-report=term-missing --cov-fail-under=95

  # Build once, so the wheel and the sdist that get smoke-tested below are the
  # exact artifacts that would be published.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: sdist must carry the package and nothing local
        run: |
          uv run --no-project python - <<'PY'
          import glob, tarfile
          with tarfile.open(glob.glob("dist/*.tar.gz")[0]) as archive:
              names = archive.getnames()
          assert any(n.endswith("src/singleflight_auth/__init__.py") for n in names), names
          assert any(n.endswith("src/singleflight_auth/py.typed") for n in names), names
          leaked = [n for n in names if "/.claude/" in n or n.endswith("rapor.md")]
          assert not leaked, f"local files leaked into the sdist: {leaked}"
          print("sdist ok")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # `uv sync --all-extras` always installs both integrations, so it can never
  # catch an __init__ that imports one of them unconditionally.  Each install
  # path has to be exercised on its own — and from **both** artifacts, because
  # a wheel built from the source tree can succeed while the sdist is missing
  # `src/` entirely.
  install-paths:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        extra: ["", "[httpx]", "[requests]", "[httpx,requests]"]
        artifact: [wheel, sdist]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Show the environment we are installing into
        run: |
          uv --version
          ls -la dist/

      - name: Install just this path
        run: |
          set -euxo pipefail
          if [ "${{ matrix.artifact }}" = "wheel" ]; then
            target="$(ls dist/*.whl)"
          else
            target="$(ls dist/*.tar.gz)"
          fi
          uv venv .venv
          # PEP 508 direct reference: the unambiguous way to combine extras
          # with a local artifact ("path.whl[extra]" is not portable syntax).
          uv pip install --python .venv \
            "singleflight-auth${{ matrix.extra }} @ file://$(readlink -f "$target")"

      - name: Import smoke test
        run: ./.venv/bin/python -c "import singleflight_auth; print(singleflight_auth.__version__)"

      - name: Integration classes resolve when their extra is installed
        run: |
          ./.venv/bin/python - <<'PY'
          import importlib.util as u, singleflight_auth as sfa
          if u.find_spec("httpx"):
              assert sfa.SingleFlightAuth and sfa.AsyncSingleFlightAuth
          if u.find_spec("requests"):
              assert sfa.RequestsSingleFlightAuth
          print("ok")
          PY

  # pyproject claims httpx>=0.24 / requests>=2.28; verify the floor, not just
  # whatever the resolver picked today.
  minimum-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install with the lowest allowed dependency versions
        run: uv sync --all-extras --dev --resolution lowest-direct

      - name: Run tests
        run: uv run pytest -q --tb=short

  # The coordinators keep their reentrancy flag in threading.local /
  # a ContextVar precisely so nothing is read outside the lock.  Without the
  # GIL that distinction stops being academic, so exercise it — but do not
  # gate merges on it while the dependency ecosystem is still catching up.
  free-threaded:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13t"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest -q --tb=short --count=5 tests/test_core.py tests/test_concurrency_stress.py

  # Races are timing-dependent: a single green run proves little.
  repeat-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Repeat the concurrency suite
        run: >
          uv run pytest tests/test_concurrency_stress.py tests/test_core.py
          -q --tb=short --count=20
