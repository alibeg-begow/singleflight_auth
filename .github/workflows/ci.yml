name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy --strict)
        run: uv run mypy src tests --strict

      - name: Run tests
        run: >
          uv run pytest -v --tb=short
          --cov=singleflight_auth --cov-report=term-missing --cov-fail-under=95

  # Build once, so the wheel and the sdist that get smoke-tested below are the
  # exact artifacts that would be published.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: sdist must carry the package and nothing local
        run: |
          uv run --no-project python - <<'PY'
          import glob, tarfile
          with tarfile.open(glob.glob("dist/*.tar.gz")[0]) as archive:
              names = archive.getnames()
          assert any(n.endswith("src/singleflight_auth/__init__.py") for n in names), names
          assert any(n.endswith("src/singleflight_auth/py.typed") for n in names), names
          leaked = [n for n in names if "/.claude/" in n or n.endswith("rapor.md")]
          assert not leaked, f"local files leaked into the sdist: {leaked}"
          print("sdist ok")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # `uv sync --all-extras` always installs both integrations, so it can never
  # catch an __init__ that imports one of them unconditionally.  Each install
  # path has to be exercised on its own — and from **both** artifacts, because
  # a wheel built from the source tree can succeed while the sdist is missing
  # `src/` entirely.
  install-paths:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        extra: ["", "[httpx]", "[requests]", "[httpx,requests]"]
        artifact: [wheel, sdist]

    # Deliberately plain: stock setup-python, stdlib venv, stock pip.  This job
    # answers "can a user install the published artifact and import it", so it
    # should install the way users do, with as few moving parts as possible.
    # The steps are split finer than usual so a failure names the exact command
    # in the checks UI, without needing to open the log.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: List the downloaded artifacts
        run: ls -la dist/

      - name: The requested artifact exists
        id: artifact
        run: |
          set -euxo pipefail
          if [ "${{ matrix.artifact }}" = "wheel" ]; then
            target="$(ls dist/*.whl)"
          else
            target="$(ls dist/*.tar.gz)"
          fi
          echo "path=$(readlink -f "$target")" >> "$GITHUB_OUTPUT"

      - name: Create a clean virtualenv
        run: python -m venv .venv

      - name: Install the artifact
        run: |
          set -euxo pipefail
          # PEP 508 direct reference — the portable way to combine extras with
          # a local file ("path.whl[extra]" is not valid requirement syntax).
          ./.venv/bin/python -m pip install \
            "singleflight-auth${{ matrix.extra }} @ file://${{ steps.artifact.outputs.path }}"

      - name: Import smoke test
        run: ./.venv/bin/python -c "import singleflight_auth; print(singleflight_auth.__version__)"

      - name: Integration classes resolve when their extra is installed
        run: |
          ./.venv/bin/python - <<'PY'
          import importlib.util as u, singleflight_auth as sfa
          if u.find_spec("httpx"):
              assert sfa.SingleFlightAuth and sfa.AsyncSingleFlightAuth
          if u.find_spec("requests"):
              assert sfa.RequestsSingleFlightAuth
          print("ok")
          PY

  # pyproject claims httpx>=0.24 / requests>=2.28; verify the floor, not just
  # whatever the resolver picked today.
  minimum-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install with the lowest allowed dependency versions
        run: uv sync --all-extras --dev --resolution lowest-direct

      - name: Run tests
        run: uv run pytest -q --tb=short

  # The coordinators keep their reentrancy flag in threading.local /
  # a ContextVar precisely so nothing is read outside the lock.  Without the
  # GIL that distinction stops being academic, so exercise it — but do not
  # gate merges on it while the dependency ecosystem is still catching up.
  free-threaded:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13t"

      - name: Create a clean virtualenv
        run: python -m venv .venv

      - name: Install only the coordinator test dependencies
        # test_core.py drives the locks directly and needs no HTTP stack, so
        # this job does not wait on httpx/werkzeug shipping free-threaded
        # wheels.  Narrow on purpose: the thing under test here is the
        # threading.local / ContextVar / WeakKeyDictionary handling.
        run: |
          set -euxo pipefail
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install pytest pytest-asyncio pytest-repeat
          ./.venv/bin/python -m pip install --no-deps .

      - name: Confirm the interpreter really is free-threaded
        run: |
          ./.venv/bin/python -c "import sys; print('GIL disabled:', not sys._is_gil_enabled())"

      - name: Run the coordinator tests
        run: ./.venv/bin/python -m pytest tests/test_core.py -q --tb=short --count=5

  # Races are timing-dependent: a single green run proves little.
  repeat-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Repeat the concurrency suite
        run: >
          uv run pytest tests/test_concurrency_stress.py tests/test_core.py
          -q --tb=short --count=20
