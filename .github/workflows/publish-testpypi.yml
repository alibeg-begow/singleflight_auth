name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Publish to TestPyPI (OIDC / Trusted Publishing)
        run: uv publish --index testpypi --trusted-publishing always
